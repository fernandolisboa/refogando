<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 484 104" role="img" aria-label="Refogando">
  <!-- Refogando lockup/wordmark (#270). "Steam-R": o R inicial recebe dois fios de vapor em
       paprica: um nasce ATRAS do R (desenhado antes do texto) e outro passa NA FRENTE, cortando o
       topo (desenhado depois). Letras em cafe; vapor em paprica. O 'R' e caractere REAL (font
       serifada de sistema, token de fonte display) e so o vapor e vetor; o textLength fixa a
       largura entre serifs. No app as cores vem de tokens (letras=text-fg, vapor=stroke-brand);
       aqui ficam fixas para portabilidade. -->
  <title>Refogando</title>
  <path d="M40 48 C45 40 37 37 42 29 C46 23 39 20 43 12 C45 9 42 7 44 4" fill="none" stroke="#C2553A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="10" y="84" textLength="446" lengthAdjust="spacingAndGlyphs" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif" font-weight="600" font-size="64" fill="#3A2E25">Refogando</text>
  <path d="M26 44 C21 37 29 33 24 25 C20 19 28 16 23 8 C22 5 25 4 24 1" fill="none" stroke="#C2553A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
