<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Refogando">
  <!-- Conceito: o 'R' serifado E a frigideira sao a MESMA forma — bojo = panela vista de cima (aro de paprica), perna = cabo, ponto de paprica refogando dentro com dois fios de aroma. -->
  <!-- R / frigideira (corpo cafe) -->
  <circle cx="32" cy="24" r="15" fill="#3A2E25"/>
  <rect x="15" y="10" width="9" height="42" rx="2.5" fill="#3A2E25"/>
  <path d="M33 35 L48 53" fill="none" stroke="#3A2E25" stroke-width="9" stroke-linecap="round"/>
  <!-- aro de paprica + superficie creme (contador do R) -->
  <circle cx="33" cy="23" r="8" fill="#C2553A"/>
  <circle cx="33" cy="23" r="7" fill="#FBF7EF"/>
  <!-- refogado: ponto de paprica -->
  <circle cx="34.5" cy="25" r="2.6" fill="#C2553A"/>
  <!-- dois fios de aroma -->
  <path d="M30 9 C 28 6 31 4 29.5 1.8" fill="none" stroke="#C2553A" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M36 9 C 38 6 35 4 36.5 1.8" fill="none" stroke="#C2553A" stroke-width="1.6" stroke-linecap="round"/>
</svg>
