<?xml version="1.0" encoding="UTF-8"?>
<!-- Variante p/ fundo escuro (#3A2E25): contorno creme garante o contraste das formas -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Refogando">
  <!-- corpo terracota com contorno creme (silhueta destaca no escuro) -->
  <path d="M31 8
           C42 10 49 18 49 30
           C49 42 41 52 33 58
           C27 52 15 42 15 30
           C15 18 22 10 31 8 Z"
        fill="#C2553A" stroke="#FBF7EF" stroke-width="2.6"/>
  <!-- nervura central -->
  <path d="M31 15 C30 27 31 41 33 54"
        fill="none" stroke="#FBF7EF" stroke-width="3.6" stroke-linecap="round"/>
  <!-- broto verde com casca creme p/ separar do fundo -->
  <path d="M30 14
           C26 9 28 3 33 2
           C36 6 35 11 30 14 Z"
        fill="#4E8A5F" stroke="#FBF7EF" stroke-width="2.2" stroke-linejoin="round"/>
</svg>
