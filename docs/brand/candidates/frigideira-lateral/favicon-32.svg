<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Refogando">
<!-- Refogando · favicon 32px (icone de app): fundo creme arredondado + skillet em perfil simplificado, 1 fio de aroma, 3 aromaticos -->
  <title>Refogando</title>
  <rect x="0" y="0" width="32" height="32" rx="7" fill="#FBF7EF"/>
  <!-- fio de aroma -->
  <path d="M15 9 C13.5 6.5 17 5.5 16 3" fill="none" stroke="#3A2E25" stroke-width="1.4" stroke-linecap="round"/>
  <!-- aromaticos -->
  <ellipse cx="11" cy="13" rx="2.6" ry="2" fill="#4E8A5F" transform="rotate(-18 11 13)"/>
  <circle cx="17" cy="11" r="2.4" fill="#C2553A"/>
  <ellipse cx="22" cy="14" rx="2.3" ry="1.9" fill="#9E4430" transform="rotate(12 22 14)"/>
  <!-- corpo da frigideira -->
  <path d="M4 18 L26 18 C26 24 24 27 20 27 L10 27 C6 27 4 24 4 18 Z" fill="#3A2E25"/>
  <!-- cabo -->
  <line x1="25" y1="18" x2="30" y2="15" stroke="#3A2E25" stroke-width="3.4" stroke-linecap="round"/>
</svg>
