<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Refogando">
  <!-- mono-cabo: o "R" tijolo cuja perna se estende num cabo e termina numa colher/frigideira -->
  <title>Refogando</title>
  <!-- haste do R -->
  <rect x="15" y="13" width="10" height="38" rx="3" fill="#9E4430"/>
  <!-- barriga (laco) do R -->
  <path d="M20 17 H31 A9 9 0 0 1 31 35 H21" fill="none" stroke="#9E4430" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- perna do R = cabo do utensilio -->
  <path d="M22 33 L53 50" fill="none" stroke="#9E4430" stroke-width="9" stroke-linecap="round"/>
  <!-- concha / colher (acento paprica) -->
  <circle cx="53" cy="50" r="9" fill="#C2553A"/>
</svg>
