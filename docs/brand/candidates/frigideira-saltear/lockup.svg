<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" role="img" aria-label="Refogando">
  <!-- lockup horizontal: simbolo frigideira-saltear + wordmark serifado -->
  <g transform="translate(6,11) scale(0.84)">
    <!-- cabo -->
    <rect x="42" y="42.5" width="20" height="6.5" rx="3.25" fill="#9E4430" transform="rotate(-13 44 46)"/>
    <!-- panela -->
    <ellipse cx="26" cy="46" rx="18" ry="8.5" fill="#C2553A"/>
    <ellipse cx="26" cy="45.5" rx="14.5" ry="6" fill="#3A2E25"/>
    <ellipse cx="21.5" cy="45.5" rx="2.4" ry="2.1" fill="#4E8A5F"/>
    <ellipse cx="30.5" cy="46.5" rx="2.2" ry="1.9" fill="#C2553A"/>
    <!-- fios de aroma -->
    <path d="M22 38 q-3 -4.5 1 -8.5" fill="none" stroke="#9E4430" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M31 38.5 q3 -4.5 -1 -8.5" fill="none" stroke="#9E4430" stroke-width="1.6" stroke-linecap="round"/>
    <!-- aromaticos no ar -->
    <circle cx="14" cy="34" r="3" fill="#4E8A5F"/>
    <circle cx="23" cy="25" r="2.9" fill="#C2553A"/>
    <circle cx="33" cy="23" r="3" fill="#F4EEE2" stroke="#3A2E25" stroke-width="1"/>
    <circle cx="43" cy="27" r="2.8" fill="#3F7A50"/>
  </g>
  <!-- wordmark serifado -->
  <text x="72" y="53" font-family="Georgia, serif" font-size="40" letter-spacing="0.5">
    <tspan fill="#C2553A">R</tspan><tspan fill="#3A2E25">efogando</tspan>
  </text>
</svg>
