<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Refogando">
  <!-- variante p/ fundo escuro (#3A2E25): aro creme + superficie paprica; contornos creme garantem AA -->
  <!-- cabo (tijolo) com contorno creme -->
  <rect x="42" y="42.5" width="20" height="6.5" rx="3.25" fill="#9E4430" stroke="#F4EEE2" stroke-width="1.5" transform="rotate(-13 44 46)"/>
  <!-- corpo da panela: aro/corpo creme + superficie paprica -->
  <ellipse cx="26" cy="46" rx="18" ry="8.5" fill="#F4EEE2"/>
  <ellipse cx="26" cy="45.5" rx="14.5" ry="6" fill="#C2553A"/>
  <!-- aromatico refogando na panela -->
  <ellipse cx="26" cy="45.8" rx="2.4" ry="2.1" fill="#4E8A5F" stroke="#FBF7EF" stroke-width="1"/>
  <!-- fios de aroma subindo (creme p/ ler no escuro) -->
  <path d="M22 38 q-3 -4.5 1 -8.5" fill="none" stroke="#F4EEE2" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M31 38.5 q3 -4.5 -1 -8.5" fill="none" stroke="#F4EEE2" stroke-width="1.6" stroke-linecap="round"/>
  <!-- aromaticos no ar, em arco (flip), com contorno creme -->
  <circle cx="14" cy="34" r="3" fill="#4E8A5F" stroke="#F4EEE2" stroke-width="1"/>
  <circle cx="23" cy="25" r="2.9" fill="#C2553A" stroke="#F4EEE2" stroke-width="1"/>
  <circle cx="33" cy="23" r="3" fill="#FBF7EF"/>
  <circle cx="43" cy="27" r="2.8" fill="#3F7A50" stroke="#F4EEE2" stroke-width="1"/>
</svg>
