<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Refogando">
<!-- Variante p/ fundo escuro (#3A2E25): disco em creme (figura clara) com R em cafe; aro paprica; cabo tijolo com fio creme. -->
<!-- handle (atras do disco) -->
<rect x="46" y="27.5" width="16" height="9" rx="4.5" fill="#9E4430" stroke="#FBF7EF" stroke-width="1"/>
<!-- disco: aro paprica + superficie creme -->
<circle cx="27" cy="32" r="23" fill="#C2553A"/>
<circle cx="27" cy="32" r="19.5" fill="#FBF7EF"/>
<!-- R em cafe -->
<g fill="#3A2E25">
  <!-- stem + serifas -->
  <rect x="19" y="17" width="8" height="30"/>
  <rect x="14" y="17" width="13" height="3"/>
  <rect x="13" y="44" width="16" height="3"/>
  <!-- bowl com contador (evenodd) -->
  <path fill-rule="evenodd" d="M25 17 C45 16, 45 33, 25 33 Z M27 20.5 C39 20.5, 39 29.5, 27 29.5 Z"/>
  <!-- leg -->
  <path d="M23 30 L32 30 L41 47 L33 47 Z"/>
  <rect x="32" y="44" width="11" height="3"/>
</g>
</svg>
