<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Refogando">
  <!-- Variante p/ fundo escuro (#3A2E25): aro e contornos creme p/ definir o corpo de ferro; aromaticos identicos -->
  <!-- aroma / vapor -->
  <g fill="none" stroke="#FBF7EF" stroke-width="2.6" stroke-linecap="round">
    <path d="M23 14 q-4 -4 0 -8" />
    <path d="M32 12 q-4 -4 0 -8" />
  </g>
  <!-- cabo (paprica com contorno creme p/ contraste no escuro) -->
  <rect x="43" y="31" width="18" height="8" rx="4" fill="#C2553A" stroke="#FBF7EF" stroke-width="1.4" />
  <!-- corpo de ferro com aro creme -->
  <circle cx="28" cy="35" r="18" fill="#3A2E25" stroke="#FBF7EF" stroke-width="3" />
  <!-- aromaticos refogando -->
  <circle cx="22" cy="31" r="4.2" fill="#4E8A5F" stroke="#FBF7EF" stroke-width="0.7" />
  <circle cx="34" cy="29" r="3.6" fill="#C2553A" stroke="#FBF7EF" stroke-width="0.7" />
  <circle cx="33" cy="41" r="3.4" fill="#4E8A5F" stroke="#FBF7EF" stroke-width="0.7" />
  <circle cx="23" cy="41" r="3" fill="#FBF7EF" />
</svg>
