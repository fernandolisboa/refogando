<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Refogando">
  <!-- Conceito: monograma R serifado com folha de erva recortada no contador (espaço negativo) -->
  <defs>
    <mask id="leafcut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="black"/>
      <g fill="white">
        <!-- haste (stem) -->
        <rect x="14" y="12" width="10" height="42"/>
        <!-- bojo (bowl) -->
        <circle cx="33" cy="25" r="13"/>
        <!-- perna (leg) -->
        <path d="M24 34 L34 34 L50 54 L40 54 Z"/>
        <!-- serifas -->
        <rect x="10" y="12" width="18" height="4"/>
        <rect x="10" y="50" width="20" height="4"/>
        <rect x="39" y="50" width="16" height="4"/>
      </g>
      <!-- folha recortada (corte culinário) -->
      <path d="M34 15.5 Q26 24 32 32.5 Q40 24 34 15.5 Z" fill="black"/>
    </mask>
  </defs>
  <rect width="64" height="64" fill="#9E4430" mask="url(#leafcut)"/>
</svg>
