<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Refogando">
  <!-- Conceito: raminho de erva (verde) entrelacado com uma pimenta/paprica (terracota) -->
  <title>Refogando</title>
  <!-- raminho: caule (vai por tras da pimenta) -->
  <path d="M22 50 C19 42 20 34 26 26 C28 23 30 20 31 16"
        fill="none" stroke="#3F7A50" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- folhas de tras -->
  <path d="M0 0 C-3 -3 -3.5 -8 0 -12 C3.5 -8 3 -3 0 0 Z" fill="#4E8A5F"
        transform="translate(21 45) rotate(-115)"/>
  <path d="M0 0 C-3 -3 -3.5 -8 0 -12 C3.5 -8 3 -3 0 0 Z" fill="#4E8A5F"
        transform="translate(23 34) rotate(-95)"/>
  <!-- pimenta / paprica -->
  <path d="M36 12 C30 14 28 20 30 28 C32 40 36 48 38 52 C44 46 48 34 46 24 C45 16 41 12 36 12 Z"
        fill="#C2553A"/>
  <!-- folha da frente (cruza por cima da pimenta = entrelacado) -->
  <path d="M0 0 C-3 -3 -3.5 -8 0 -12 C3.5 -8 3 -3 0 0 Z" fill="#4E8A5F"
        transform="translate(28 22) rotate(-55)"/>
  <!-- cabinho verde da pimenta -->
  <path d="M34 13 C33 9 35 7 37 6 C38 8 37 11 38 13 Z" fill="#4E8A5F"/>
</svg>
