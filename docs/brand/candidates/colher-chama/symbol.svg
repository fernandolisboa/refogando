<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Refogando">
  <!-- Conceito: colher de pau cruzando uma chama estilizada — o ato de cozinhar -->
  <!-- Chama (paprica): forma grande e solida -->
  <path d="M32 5
           C 41 16, 47 25, 47 36
           C 47 47, 40 55, 32 55
           C 24 55, 17 47, 17 36
           C 17 25, 23 16, 32 5 Z"
        fill="#C2553A"/>
  <!-- Nucleo da chama (paprica forte) — da profundidade, some no favicon -->
  <path d="M32 21
           C 37 28, 40 33, 40 39
           C 40 46, 36.5 51, 32 51
           C 27.5 51, 24 46, 24 39
           C 24 33, 27 28, 32 21 Z"
        fill="#9E4430"/>
  <!-- Colher de pau (cafe) cruzando a chama na diagonal -->
  <g transform="rotate(-45 32 32)">
    <line x1="12" y1="32" x2="40" y2="32"
          stroke="#3A2E25" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="44" cy="32" rx="8" ry="6" fill="#3A2E25"/>
  </g>
</svg>
