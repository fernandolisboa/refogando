document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<!-- Standalone: the prototype mounts RefoStage.dc.html via dc-import, which fetches it\n     at runtime. Inline it as a bundled resource and redirect that sibling fetch to the blob. -->\n\n<script>\n(function(){\n  var origFetch = window.fetch ? window.fetch.bind(window) : null;\n  if (!origFetch) return;\n  window.fetch = function(input, init){\n    try {\n      var url = typeof input === 'string' ? input : (input && input.url) || '';\n      if (url.indexOf('RefoStage.dc.html') !== -1 && window.__resources && window.__resources.refoStage) {\n        return origFetch(window.__resources.refoStage, init);\n      }\n    } catch (e) {}\n    return origFetch(input, init);\n  };\n})();\n<\u002Fscript>\n<script src=\"9a4d90c3-7ee3-44bb-aae6-4d28de6dcbaa\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* ============================================================================\n   Refogando — Color tokens (OKLCH)\n   Source of truth: refogando/src/app/globals.css (issue #54).\n   Identity: warm & appetizing (refogado = the aromatic base that gives flavor) —\n   paprika terracotta + herb green over a warm cream/dough. NOT generic AI slate.\n\n   Accessibility is a token constraint: every fg/bg pair targets WCAG AA\n   (>=4.5:1 body, >=3:1 large/UI), verified by OKLCH->sRGB contrast math.\n\n   Three layers:\n     1. Brand palette  — raw OKLCH ramps (--paprika-*, --herb-*, --dough-*, --amber-*)\n     2. Semantic tokens — the codebase names (--color-bg, --color-surface, …)\n     3. shadcn aliases  — Tailwind-v4 shadcn convention (--background, --primary, …)\n   Dark mode overrides the semantic layer; aliases follow automatically.\n============================================================================ */\n\n:root {\n  /* ── 1. Brand palette (raw ramps) ─────────────────────────────────────── */\n  /* Paprika / terracotta — the soul color */\n  --paprika-300: oklch(0.78 0.13 45);\n  --paprika-500: oklch(0.62 0.17 40);  /* decorative / large text */\n  --paprika-600: oklch(0.515 0.155 38); /* button fill — white-on-top passes AA */\n  /* Herb green — the catalog seal accent */\n  --herb-300: oklch(0.74 0.12 150);\n  --herb-500: oklch(0.58 0.11 150);\n  --herb-600: oklch(0.5 0.11 152);\n  --herb-surface: oklch(0.95 0.04 150);\n  /* Warm dough/cream neutrals (hue ~85, low chroma) */\n  --dough-50: oklch(0.985 0.008 85);   /* cream canvas */\n  --dough-100: oklch(0.965 0.012 85);  /* dough surface */\n  --dough-200: oklch(0.9 0.012 85);    /* border */\n  --coffee-700: oklch(0.505 0.025 55); /* muted text */\n  --coffee-900: oklch(0.26 0.02 55);   /* body text */\n  /* Amber — restriction warning (NEVER red) */\n  --amber-fg: oklch(0.47 0.1 72);\n  --amber-bg: oklch(0.93 0.06 80);\n\n  /* ── 2. Semantic tokens (codebase names) — LIGHT ──────────────────────── */\n  --color-bg: var(--dough-50);                /* cream — canvas */\n  --color-surface: var(--dough-100);          /* dough — panel/card */\n  --color-fg: var(--coffee-900);              /* coffee — text */\n  --color-muted: var(--coffee-700);           /* secondary text (AA on cream) */\n  --color-border: var(--dough-200);\n  --color-brand: var(--paprika-500);          /* paprika — decorative / large text */\n  --color-brand-strong: var(--paprika-600);   /* button FILL — white-on-top passes AA */\n  --color-on-brand: oklch(1 0 0);             /* text over brand-strong */\n  --color-brand-ink: var(--paprika-600);      /* brand TEXT (wordmark/link) */\n  --color-accent: var(--herb-500);            /* herb — catalog seal (origin=catalog) */\n  --color-accent-strong: var(--herb-600);     /* herb as text (AA on cream) */\n  --color-accent-surface: var(--herb-surface);/* herb-tinted surface for the seal */\n  --color-aviso-fg: var(--amber-fg);          /* restriction warning — amber (not red) */\n  --color-aviso-bg: var(--amber-bg);\n  --color-ring: var(--paprika-600);           /* visible focus */\n\n  /* ── 3. shadcn aliases (Tailwind v4 CSS-first convention) ─────────────── */\n  /* Fill these tokens with Refogando's warm palette — NOT shadcn's default\n     slate. shadcn enters as structure + accessibility; the skin is 100%\n     Refogando. Map 1:1 to the semantic layer above. */\n  --background: var(--color-bg);\n  --foreground: var(--color-fg);\n  --card: var(--color-surface);\n  --card-foreground: var(--color-fg);\n  --popover: var(--color-surface);\n  --popover-foreground: var(--color-fg);\n  --primary: var(--color-brand-strong);\n  --primary-foreground: var(--color-on-brand);\n  --secondary: var(--color-surface);\n  --secondary-foreground: var(--color-fg);\n  --muted: var(--color-surface);\n  --muted-foreground: var(--color-muted);\n  --accent: var(--color-accent-surface);\n  --accent-foreground: var(--color-accent-strong);\n  /* \"destructive\" in shadcn semantics maps to Refogando's AMBER aviso — we\n     never use red; warnings inform, they don't block. */\n  --destructive: var(--color-aviso-fg);\n  --destructive-foreground: var(--color-on-brand);\n  --border: var(--color-border);\n  --input: var(--color-border);\n  --ring: var(--color-ring);\n}\n\n/* ── Dark mode — same DNA, re-verified AA ──────────────────────────────────\n   Overrides only the SEMANTIC layer; aliases inherit. Supports both the OS\n   media query and an explicit .dark class (shadcn convention). */\n@media (prefers-color-scheme: dark) {\n  :root {\n    --color-bg: oklch(0.205 0.018 55);\n    --color-surface: oklch(0.255 0.02 55);\n    --color-fg: oklch(0.93 0.012 85);\n    --color-muted: oklch(0.74 0.02 82);\n    --color-border: oklch(0.34 0.02 55);\n    --color-brand: oklch(0.78 0.13 45);\n    --color-brand-strong: oklch(0.515 0.155 38); /* button — white on top, same */\n    --color-on-brand: oklch(1 0 0);\n    --color-brand-ink: oklch(0.78 0.13 45);       /* dark brand text = 8.61:1 */\n    --color-accent: oklch(0.74 0.12 150);\n    --color-accent-strong: oklch(0.74 0.12 150);\n    --color-accent-surface: oklch(0.3 0.05 150);\n    --color-aviso-fg: oklch(0.86 0.1 80);\n    --color-aviso-bg: oklch(0.3 0.06 75);\n    --color-ring: oklch(0.78 0.13 45);\n  }\n}\n\n.dark {\n  --color-bg: oklch(0.205 0.018 55);\n  --color-surface: oklch(0.255 0.02 55);\n  --color-fg: oklch(0.93 0.012 85);\n  --color-muted: oklch(0.74 0.02 82);\n  --color-border: oklch(0.34 0.02 55);\n  --color-brand: oklch(0.78 0.13 45);\n  --color-brand-strong: oklch(0.515 0.155 38);\n  --color-on-brand: oklch(1 0 0);\n  --color-brand-ink: oklch(0.78 0.13 45);\n  --color-accent: oklch(0.74 0.12 150);\n  --color-accent-strong: oklch(0.74 0.12 150);\n  --color-accent-surface: oklch(0.3 0.05 150);\n  --color-aviso-fg: oklch(0.86 0.1 80);\n  --color-aviso-bg: oklch(0.3 0.06 75);\n  --color-ring: oklch(0.78 0.13 45);\n}\n<\u002Fstyle>\n<style>/* ============================================================================\n   Refogando — Typography tokens\n   System stacks only (zero network fonts — safe in build/CI). The display\n   serif gives the editorial moment (wordmark, recipe title); the sans is the\n   system UI body.\n============================================================================ */\n\n:root {\n  /* Font stacks — NO @font-face, NO network fonts (hard product constraint). */\n  --font-sans: ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", Roboto,\n    \"Helvetica Neue\", Arial, sans-serif;\n  /* Display serif — Palatino / Iowan Old Style family. Editorial, warm,\n     bookish; used for the wordmark and recipe titles. */\n  --font-display: \"Iowan Old Style\", \"Palatino Linotype\", Palatino,\n    \"Book Antiqua\", Georgia, \"Times New Roman\", serif;\n  --font-mono: ui-monospace, SFMono-Regular, \"SF Mono\", Menlo, Consolas,\n    \"Liberation Mono\", monospace;\n\n  /* Type scale (rem) — modest, editorial. */\n  --text-xs: 0.75rem;    /* 12px — seals, meta, captions */\n  --text-sm: 0.875rem;   /* 14px — secondary, controls */\n  --text-base: 1rem;     /* 16px — body */\n  --text-lg: 1.125rem;   /* 18px — card title, lead */\n  --text-xl: 1.25rem;    /* 20px — section heading */\n  --text-2xl: 1.5rem;    /* 24px — page subhead / wordmark */\n  --text-3xl: 1.875rem;  /* 30px — page title */\n  --text-4xl: 2.25rem;   /* 36px — recipe hero */\n  --text-5xl: 3rem;      /* 48px — marketing display */\n\n  /* Line heights */\n  --leading-tight: 1.15;  /* display headings */\n  --leading-snug: 1.3;\n  --leading-normal: 1.55; /* body copy */\n\n  /* Weights — system fonts: 400 / 500 / 600 carry the whole system. */\n  --weight-normal: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n\n  /* Tracking */\n  --tracking-tight: -0.02em; /* display headings */\n  --tracking-normal: 0;\n\n  /* Measure — comfortable reading width for prose (steps, description). */\n  --measure: 68ch;\n}\n<\u002Fstyle>\n<style>/* ============================================================================\n   Refogando — Font face declarations\n   Refogando ships ZERO network fonts (hard product constraint). The display\n   serif is a SYSTEM family (Palatino / Iowan Old Style). These @font-face\n   rules are local()-only: they bind the named family to the user's installed\n   copy with NO url() — so nothing is downloaded, nothing needs uploading, and\n   no substitute family is introduced. If a machine lacks the font, the rule\n   simply doesn't match and the --font-display stack falls through to the next\n   system serif (exactly today's behavior).\n============================================================================ */\n\n@font-face {\n  font-family: \"Iowan Old Style\";\n  src: local(\"Iowan Old Style\");\n  font-weight: 400 700;\n  font-style: normal;\n}\n\n@font-face {\n  font-family: \"Palatino Linotype\";\n  src: local(\"Palatino Linotype\"), local(\"Palatino\");\n  font-weight: 400 700;\n  font-style: normal;\n}\n<\u002Fstyle>\n<style>/* ============================================================================\n   Refogando — Spacing, radius & layout tokens\n   Soft, home-cooking rounding. Spacing on a 4px base.\n============================================================================ */\n\n:root {\n  /* Spacing scale (4px base) */\n  --space-0: 0;\n  --space-1: 0.25rem;  /* 4 */\n  --space-2: 0.5rem;   /* 8 */\n  --space-3: 0.75rem;  /* 12 */\n  --space-4: 1rem;     /* 16 */\n  --space-5: 1.25rem;  /* 20 */\n  --space-6: 1.5rem;   /* 24 */\n  --space-8: 2rem;     /* 32 */\n  --space-10: 2.5rem;  /* 40 */\n  --space-12: 3rem;    /* 48 */\n  --space-16: 4rem;    /* 64 */\n\n  /* Radius — soft, home-cooking rounding (issue #54). shadcn reads --radius\n     and derives sm/md/lg from it; we expose the explicit ramp the codebase\n     uses and set --radius to the md step. */\n  --radius-sm: 0.375rem; /* 6px  — seals, chips, inputs, small buttons */\n  --radius-md: 0.625rem; /* 10px — buttons, cards, panels */\n  --radius-lg: 1rem;     /* 16px — large cards, dialogs */\n  --radius-xl: 1.5rem;   /* 24px — hero surfaces */\n  --radius: var(--radius-md); /* shadcn base */\n  --radius-full: 9999px; /* restriction chips, avatars */\n\n  /* Layout */\n  --container-page: 72rem; /* max content width */\n}\n<\u002Fstyle>\n<style>/* ============================================================================\n   Refogando — Elevation tokens\n   Low shadow, tinted with warm brown (NOT pure black). Keeps surfaces feeling\n   like paper/dough rather than glassy SaaS cards.\n============================================================================ */\n\n:root {\n  /* Warm-brown tinted shadows — rgb(56 40 24) is a coffee brown, never #000. */\n  --shadow-sm: 0 1px 2px rgb(56 40 24 / 0.08), 0 1px 1px rgb(56 40 24 / 0.05);\n  --shadow-md: 0 4px 14px rgb(56 40 24 / 0.1), 0 2px 4px rgb(56 40 24 / 0.06);\n  --shadow-lg: 0 10px 30px rgb(56 40 24 / 0.12), 0 4px 8px rgb(56 40 24 / 0.07);\n\n  /* Focus ring (paired with --color-ring) — visible, keyboard-only via\n     :focus-visible. Defined here as a reusable spec. */\n  --ring-width: 2px;\n  --ring-offset: 2px;\n}\n<\u002Fstyle>\n<style>/* ============================================================================\n   Refogando — Motion tokens\n   Short, gentle. Respected by the prefers-reduced-motion gate in base styles.\n============================================================================ */\n\n:root {\n  /* Easing — gentle ease-out (overshoot-free, settles softly). */\n  --ease-out: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */\n\n  /* Durations — short. UI feedback should feel instant, not animated. */\n  --duration-fast: 120ms;  /* @kind other */\n  --duration-base: 150ms;  /* @kind other */\n  --duration-slow: 240ms;  /* @kind other */\n}\n<\u002Fstyle>\n<style>/* ============================================================================\n   Refogando — Base layer\n   Document defaults that every card / component / screen inherits. Mirrors the\n   @layer base of refogando/src/app/globals.css.\n============================================================================ */\n\nhtml {\n  color-scheme: light dark; /* native select/scrollbar follow the theme */\n}\n\nbody {\n  background-color: var(--color-bg);\n  color: var(--color-fg);\n  font-family: var(--font-sans);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  margin: 0;\n}\n\n/* Display serif for headings by default — the editorial moment. */\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  color: var(--color-fg);\n  margin: 0;\n}\n\n/* Balanced wrap avoids the one-word \"widow\" on the last heading line. */\nh1, h2, h3 {\n  text-wrap: balance;\n}\n\np {\n  text-wrap: pretty;\n}\n\na {\n  color: var(--color-brand-ink);\n}\n\n/* Consistent visible focus (a11y) — keyboard, not click. */\n:focus-visible {\n  outline: var(--ring-width) solid var(--color-ring);\n  outline-offset: var(--ring-offset);\n  border-radius: var(--radius-sm);\n}\n\n/* Stable selection across both themes: white over fixed brand-strong = 6.05:1. */\n::selection {\n  background-color: var(--color-brand-strong);\n  color: var(--color-on-brand);\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 0.01ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.01ms !important;\n    scroll-behavior: auto !important;\n  }\n}\n\n/* Screen-reader-only helper (loading/error states). */\n.sr-only {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip: rect(0, 0, 0, 0);\n  white-space: nowrap;\n  border-width: 0;\n}\n<\u002Fstyle>\n<style>/* ============================================================================\n   Refogando Design System — global stylesheet entry point.\n   Consumers link THIS one file. It is a manifest of @imports only — every\n   token file and the base layer below is shipped to consumers through it.\n\n   Tokens come from the live product (refogando/src/app/globals.css, issue #54)\n   and are the single source of truth: warm cream/dough + paprika terracotta +\n   herb green, OKLCH, WCAG AA, dark-mode aware, zero network fonts.\n============================================================================ */\n\n/* ============================================================================\n   Refogando — Color tokens (OKLCH)\n   Source of truth: refogando/src/app/globals.css (issue #54).\n   Identity: warm & appetizing (refogado = the aromatic base that gives flavor) —\n   paprika terracotta + herb green over a warm cream/dough. NOT generic AI slate.\n\n   Accessibility is a token constraint: every fg/bg pair targets WCAG AA\n   (>=4.5:1 body, >=3:1 large/UI), verified by OKLCH->sRGB contrast math.\n\n   Three layers:\n     1. Brand palette  — raw OKLCH ramps (--paprika-*, --herb-*, --dough-*, --amber-*)\n     2. Semantic tokens — the codebase names (--color-bg, --color-surface, …)\n     3. shadcn aliases  — Tailwind-v4 shadcn convention (--background, --primary, …)\n   Dark mode overrides the semantic layer; aliases follow automatically.\n============================================================================ */\n\n:root {\n  /* ── 1. Brand palette (raw ramps) ─────────────────────────────────────── */\n  /* Paprika / terracotta — the soul color */\n  --paprika-300: oklch(0.78 0.13 45);\n  --paprika-500: oklch(0.62 0.17 40);  /* decorative / large text */\n  --paprika-600: oklch(0.515 0.155 38); /* button fill — white-on-top passes AA */\n  /* Herb green — the catalog seal accent */\n  --herb-300: oklch(0.74 0.12 150);\n  --herb-500: oklch(0.58 0.11 150);\n  --herb-600: oklch(0.5 0.11 152);\n  --herb-surface: oklch(0.95 0.04 150);\n  /* Warm dough/cream neutrals (hue ~85, low chroma) */\n  --dough-50: oklch(0.985 0.008 85);   /* cream canvas */\n  --dough-100: oklch(0.965 0.012 85);  /* dough surface */\n  --dough-200: oklch(0.9 0.012 85);    /* border */\n  --coffee-700: oklch(0.505 0.025 55); /* muted text */\n  --coffee-900: oklch(0.26 0.02 55);   /* body text */\n  /* Amber — restriction warning (NEVER red) */\n  --amber-fg: oklch(0.47 0.1 72);\n  --amber-bg: oklch(0.93 0.06 80);\n\n  /* ── 2. Semantic tokens (codebase names) — LIGHT ──────────────────────── */\n  --color-bg: var(--dough-50);                /* cream — canvas */\n  --color-surface: var(--dough-100);          /* dough — panel/card */\n  --color-fg: var(--coffee-900);              /* coffee — text */\n  --color-muted: var(--coffee-700);           /* secondary text (AA on cream) */\n  --color-border: var(--dough-200);\n  --color-brand: var(--paprika-500);          /* paprika — decorative / large text */\n  --color-brand-strong: var(--paprika-600);   /* button FILL — white-on-top passes AA */\n  --color-on-brand: oklch(1 0 0);             /* text over brand-strong */\n  --color-brand-ink: var(--paprika-600);      /* brand TEXT (wordmark/link) */\n  --color-accent: var(--herb-500);            /* herb — catalog seal (origin=catalog) */\n  --color-accent-strong: var(--herb-600);     /* herb as text (AA on cream) */\n  --color-accent-surface: var(--herb-surface);/* herb-tinted surface for the seal */\n  --color-aviso-fg: var(--amber-fg);          /* restriction warning — amber (not red) */\n  --color-aviso-bg: var(--amber-bg);\n  --color-ring: var(--paprika-600);           /* visible focus */\n\n  /* ── 3. shadcn aliases (Tailwind v4 CSS-first convention) ─────────────── */\n  /* Fill these tokens with Refogando's warm palette — NOT shadcn's default\n     slate. shadcn enters as structure + accessibility; the skin is 100%\n     Refogando. Map 1:1 to the semantic layer above. */\n  --background: var(--color-bg);\n  --foreground: var(--color-fg);\n  --card: var(--color-surface);\n  --card-foreground: var(--color-fg);\n  --popover: var(--color-surface);\n  --popover-foreground: var(--color-fg);\n  --primary: var(--color-brand-strong);\n  --primary-foreground: var(--color-on-brand);\n  --secondary: var(--color-surface);\n  --secondary-foreground: var(--color-fg);\n  --muted: var(--color-surface);\n  --muted-foreground: var(--color-muted);\n  --accent: var(--color-accent-surface);\n  --accent-foreground: var(--color-accent-strong);\n  /* \"destructive\" in shadcn semantics maps to Refogando's AMBER aviso — we\n     never use red; warnings inform, they don't block. */\n  --destructive: var(--color-aviso-fg);\n  --destructive-foreground: var(--color-on-brand);\n  --border: var(--color-border);\n  --input: var(--color-border);\n  --ring: var(--color-ring);\n}\n\n/* ── Dark mode — same DNA, re-verified AA ──────────────────────────────────\n   Overrides only the SEMANTIC layer; aliases inherit. Supports both the OS\n   media query and an explicit .dark class (shadcn convention). */\n@media (prefers-color-scheme: dark) {\n  :root {\n    --color-bg: oklch(0.205 0.018 55);\n    --color-surface: oklch(0.255 0.02 55);\n    --color-fg: oklch(0.93 0.012 85);\n    --color-muted: oklch(0.74 0.02 82);\n    --color-border: oklch(0.34 0.02 55);\n    --color-brand: oklch(0.78 0.13 45);\n    --color-brand-strong: oklch(0.515 0.155 38); /* button — white on top, same */\n    --color-on-brand: oklch(1 0 0);\n    --color-brand-ink: oklch(0.78 0.13 45);       /* dark brand text = 8.61:1 */\n    --color-accent: oklch(0.74 0.12 150);\n    --color-accent-strong: oklch(0.74 0.12 150);\n    --color-accent-surface: oklch(0.3 0.05 150);\n    --color-aviso-fg: oklch(0.86 0.1 80);\n    --color-aviso-bg: oklch(0.3 0.06 75);\n    --color-ring: oklch(0.78 0.13 45);\n  }\n}\n\n.dark {\n  --color-bg: oklch(0.205 0.018 55);\n  --color-surface: oklch(0.255 0.02 55);\n  --color-fg: oklch(0.93 0.012 85);\n  --color-muted: oklch(0.74 0.02 82);\n  --color-border: oklch(0.34 0.02 55);\n  --color-brand: oklch(0.78 0.13 45);\n  --color-brand-strong: oklch(0.515 0.155 38);\n  --color-on-brand: oklch(1 0 0);\n  --color-brand-ink: oklch(0.78 0.13 45);\n  --color-accent: oklch(0.74 0.12 150);\n  --color-accent-strong: oklch(0.74 0.12 150);\n  --color-accent-surface: oklch(0.3 0.05 150);\n  --color-aviso-fg: oklch(0.86 0.1 80);\n  --color-aviso-bg: oklch(0.3 0.06 75);\n  --color-ring: oklch(0.78 0.13 45);\n}\n\n/* ============================================================================\n   Refogando — Typography tokens\n   System stacks only (zero network fonts — safe in build/CI). The display\n   serif gives the editorial moment (wordmark, recipe title); the sans is the\n   system UI body.\n============================================================================ */\n\n:root {\n  /* Font stacks — NO @font-face, NO network fonts (hard product constraint). */\n  --font-sans: ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", Roboto,\n    \"Helvetica Neue\", Arial, sans-serif;\n  /* Display s ystem serif (exactly today's behavior).\n============================================================================ */\n\n@font-face {\n  font-family: \"Iowan Old Style\";\n  src: local(\"Iowan Old Style\");\n  font-weight: 400 700;\n  font-style: normal;\n}\n\n@font-face {\n  font-family: \"Palatino Linotype\";\n  src: local(\"Palatino Linotype\"), local(\"Palatino\");\n  font-weight: 400 700;\n  font-style: normal;\n}\n\n/* ============================================================================\n   Refogando — Spacing, radius & layout tokens\n   Soft, home-cooking rounding. Spacing on a 4px base.\n============================================================================ */\n\n:root {\n  /* Spacing scale (4px base) */\n  --space-0: 0;\n  --space-1: 0.25rem;  /* 4 */\n  --space-2: 0.5rem;   /* 8 */\n  --space-3: 0.75rem;  /* 12 */\n  --space-4: 1rem;     /* 16 */\n  --space-5: 1.25rem;  /* 20 */\n  --space-6: 1.5rem;   /* 24 */\n  --space-8: 2rem;     /* 32 */\n  --space-10: 2.5rem;  /* 40 */\n  --space-12: 3rem;    /* 48 */\n  --space-16: 4rem;    /* 64 */\n\n  /* Radius — soft, home-cooking rounding (issue #54). shadcn reads --radius\n     and derives sm/md/lg from it; we expose the explicit ramp the codebase\n     uses and set --radius to the md step. */\n  --radius-sm: 0.375rem; /* 6px  — seals, chips, inputs, small buttons */\n  --radius-md: 0.625rem; /* 10px — buttons, cards, panels */\n  --radius-lg: 1rem;     /* 16px — large cards, dialogs */\n  --radius-xl: 1.5rem;   /* 24px — hero surfaces */\n  --radius: var(--radius-md); /* shadcn base */\n  --radius-full: 9999px; /* restriction chips, avatars */\n\n  /* Layout */\n  --container-page: 72rem; /* max content width */\n}\n\n/* ============================================================================\n   Refogando — Elevation tokens\n   Low shadow, tinted with warm brown (NOT pure black). Keeps surfaces feeling\n   like paper/dough rather than glassy SaaS cards.\n============================================================================ */\n\n:root {\n  /* Warm-brown tinted shadows — rgb(56 40 24) is a coffee brown, never #000. */\n  --shadow-sm: 0 1px 2px rgb(56 40 24 / 0.08), 0 1px 1px rgb(56 40 24 / 0.05);\n  --shadow-md: 0 4px 14px rgb(56 40 24 / 0.1), 0 2px 4px rgb(56 40 24 / 0.06);\n  --shadow-lg: 0 10px 30px rgb(56 40 24 / 0.12), 0 4px 8px rgb(56 40 24 / 0.07);\n\n  /* Focus ring (paired with --color-ring) — visible, keyboard-only via\n     :focus-visible. Defined here as a reusable spec. */\n  --ring-width: 2px;\n  --ring-offset: 2px;\n}\n\n/* ============================================================================\n   Refogando — Motion tokens\n   Short, gentle. Respected by the prefers-reduced-motion gate in base styles.\n============================================================================ */\n\n:root {\n  /* Easing — gentle ease-out (overshoot-free, settles softly). */\n  --ease-out: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */\n\n  /* Durations — short. UI feedback should feel instant, not animated. */\n  --duration-fast: 120ms;  /* @kind other */\n  --duration-base: 150ms;  /* @kind other */\n  --duration-slow: 240ms;  /* @kind other */\n}\n\n/* ============================================================================\n   Refogando — Base layer\n   Document defaults that every card / component / screen inherits. Mirrors the\n   @layer base of refogando/src/app/globals.css.\n============================================================================ */\n\nhtml {\n  color-scheme: light dark; /* native select/scrollbar follow the theme */\n}\n\nbody {\n  background-color: var(--color-bg);\n  color: var(--color-fg);\n  font-family: var(--font-sans);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  margin: 0;\n}\n\n/* Display serif for headings by default — dex:120;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:13px 28px;background:oklch(0.985 0.008 85);border-bottom:1px solid oklch(0.9 0.012 85)\">\n    <div style=\"display:flex;flex-direction:column;line-height:1.12\">\n      <span style=\"font-family:var(--font-display);font-size:1.3rem;font-weight:600;letter-spacing:-0.02em;color:oklch(0.515 0.155 38)\">Refogando<\u002Fspan>\n      <span style=\"font-size:0.72rem;color:oklch(0.505 0.025 55)\">Protótipo navegável · editorial · desktop &amp; mobile<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-left:auto;display:flex;align-items:center;gap:10px\">\n      <span style=\"font-size:0.74rem;color:oklch(0.505 0.025 55)\">Tema<\u002Fspan>\n      <div style=\"display:inline-flex;background:oklch(0.965 0.012 85);border:1px solid oklch(0.9 0.012 85);border-radius:9999px;padding:3px\">\n        <button onclick=\"{{ setLight }}\" style=\"{{ lightBtnStyle }}\">Claro<\u002Fbutton>\n        <button onclick=\"{{ setDark }}\" style=\"{{ darkBtnStyle }}\">Escuro<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- Themed stage — remounted per theme so var() resolves fresh -->\n  <sc-if value=\"{{ isLight }}\" hint-placeholder-val=\"{{ true }}\">\n    <dc-import name=\"RefoStage\" theme=\"light\" model=\"{{ model }}\" hint-size=\"100%,760px\" style=\"display:block\"><\u002Fdc-import>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ isDark }}\" hint-placeholder-val=\"{{ false }}\">\n    <dc-import name=\"RefoStage\" theme=\"dark\" model=\"{{ model }}\" hint-size=\"100%,760px\" style=\"display:block\"><\u002Fdc-import>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1480,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  state = {\n    dark: false, proto: 'home', createMode: 'conversa', sort: 'relevancia',\n    query: '', facets: [], current: 'feijoada',\n    voted: false, votes: 212, favorited: true,\n    transcriptOpen: false, generated: false, generating: false, loggedIn: true,\n  };\n\n  map() {\n    return {\n      feijoada: { id:'feijoada', title:'Feijoada vegetariana', tr:'Vegetarian bean stew', prov:'comunidade', seal:'Da comunidade', author:{name:'Marina Alves',handle:'marina'}, auto:false, cozinha:'Brasileira', categoria:'Prato principal', porcoes:6, dificuldade:'2/5', votes:212, favorited:true, aiPhoto:false, restricoes:['vegetariana','sem glúten'],\n        aviso:{ title:'Aviso de restrição', body:'Marcada como sem glúten, mas leva shoyu — declarado, não verificado.' },\n        desc:'Feijão-preto, legumes defumados e laranja — toda a alma da feijoada, sem carne.',\n        ingredientes:['400 g — feijão-preto','1 unidade — abóbora cabotiá em cubos','200 g — tofu defumado','2 dentes — alho · 1 unidade — cebola','a gosto — louro e laranja'],\n        passos:['Deixe o feijão de molho na véspera e cozinhe com louro até amaciar.','Refogue alho e cebola, junte a abóbora e o tofu defumado e doure.','Misture tudo ao feijão e cozinhe até o caldo encorpar. Sirva com laranja e arroz.'] },\n      bobo: { id:'bobo', title:'Bobó de camarão', tr:'Shrimp & cassava stew', prov:'catalogo', seal:'Do catálogo', author:null, auto:false, cozinha:'Baiana', categoria:'Prato principal', porcoes:4, dificuldade:'3/5', votes:null, favorited:false, aiPhoto:true, restricoes:['sem glúten'], aviso:null,\n        desc:'Mandioca cremosa, leite de coco e camarão salteado no dendê.',\n        ingredientes:['500 g — camarão limpo','500 g — mandioca (aipim)','200 ml — leite de coco','2 colheres — azeite de dendê','1 unidade — cebola · 2 dentes — alho','a gosto — coentro'],\n        passos:['Cozinhe a mandioca e bata com o leite de coco até virar um creme liso.','Refogue cebola, alho e tomate no dendê até soltar o aroma.','Junte os camarões e salteie até ficarem rosados.','Misture o creme, ajuste o sal e finalize com coentro.'] },\n      chana: { id:'chana', title:'Chana masala', tr:'Curry de grão-de-bico', prov:'comunidade', seal:'Da comunidade', author:{name:'Rahul Nair',handle:'rahul'}, auto:true, cozinha:'Indiana', categoria:'Prato principal', porcoes:4, dificuldade:'2/5', votes:96, favorited:false, aiPhoto:false, restricoes:['vegana','sem lactose'], aviso:null,\n        desc:'Grão-de-bico cozido em molho de tomate e especiarias, sem pimenta.',\n        ingredientes:['400 g — grão-de-bico cozido','1 unidade — cebola · 2 dentes — alho','1 colher de chá — garam masala','1 colher de chá — cúrcuma','2 unidades — tomate','a gosto — coentro'],\n        passos:['Refogue cebola e alho até dourar.','Junte os temperos e mexa por um minuto.','Acrescente tomate e deixe apurar.','Adicione o grão-de-bico e cozinhe até encorpar.'] },\n      fuba: { id:'fuba', title:'Bolo de fubá com goiabada', tr:'Cornmeal & guava cake', prov:'minha', seal:'Sua receita', author:{name:'Você',handle:'voce'}, auto:false, cozinha:'Mineira', categoria:'Sobremesa', porcoes:10, dificuldade:'2/5', votes:12, favorited:false, aiPhoto:false, restricoes:[], aviso:null,\n        desc:'Fubá fininho, erva-doce e goiabada derretida no meio.',\n        ingredientes:['3 unidades — ovo','2 xícaras — fubá','2 xícaras — açúcar','1 xícara — óleo · 1 xícara — leite','1 colher — fermento','200 g — goiabada em cubos'],\n        passos:['Bata os líquidos e o açúcar no liquidificador.','Junte o fubá e o fermento e misture.','Despeje na forma, espalhe a goiabada e asse a 180°C por 40 min.'] },\n      frittata: { id:'frittata', title:'Frittata de abobrinha', tr:'Zucchini frittata', prov:'minha', seal:'Sua receita', author:{name:'Você',handle:'voce'}, auto:false, cozinha:'Italiana', categoria:'Prato principal', porcoes:4, dificuldade:'2/5', votes:0, favorited:false, aiPhoto:true, restricoes:['vegetariana'], aviso:null,\n        desc:'Dourada por fora, cremosa por dentro — pronta em 20 minutos, sem cebola.',\n        ingredientes:['6 unidades — ovo','1 unidade — abobrinha em rodelas','100 g — queijo meia-cura ralado','1 unidade — alho-poró','a gosto — sal e azeite'],\n        passos:['Refogue o alho-poró e a abobrinha no azeite até murchar.','Bata os ovos com o queijo e o sal.','Despeje sobre os legumes e cozinhe em fogo baixo.','Finalize no forno até dourar e firmar o centro.'] },\n      curry: { id:'curry', title:'Curry de grão-de-bico', tr:'Chickpea curry', prov:'minha', seal:'Sua receita', author:{name:'Você',handle:'voce'}, auto:false, cozinha:'Indiana', categoria:'Prato principal', porcoes:4, dificuldade:'2/5', votes:0, favorited:false, aiPhoto:false, restricoes:['vegana','sem lactose'],\n        aviso:{ title:'Aviso de restrição', body:'Marcada como vegana, mas a finalização sugere iogurte — declarado, não verificado.' },\n        desc:'Curry vegano cremoso de leite de coco, sem pimenta — pensado para a semana.',\n        ingredientes:['400 g — grão-de-bico cozido','200 ml — leite de coco','1 unidade — cebola · 2 dentes — alho','1 colher — curry em pó','1 unidade — tomate'],\n        passos:['Refogue cebola e alho até dourar.','Junte os temperos e mexa por um minuto.','Acrescente tomate e leite de coco e deixe apurar.','Adicione o grão-de-bico e cozinhe até encorpar.'] },\n    };\n  }\n\n  homeList() { const m = this.map(); return [m.feijoada, m.bobo, m.chana, m.fuba]; }\n  cur() { return this.map()[this.state.current] || this.map().feijoada; }\n\n  filtered() {\n    const q = (this.state.query || '').trim().toLowerCase();\n    let l = this.homeList().filter(r => {\n      if (q && !((r.title + ' ' + (r.tr||'') + ' ' + r.desc + ' ' + r.cozinha + ' ' + r.categoria).toLowerCase().includes(q))) return false;\n      for (const f of this.state.facets) { if (r.cozinha !== f && r.categoria !== f) return false; }\n      return true;\n    });\n    if (this.state.sort === 'popularidade') l = [...l].sort((a, b) => (b.votes||0) - (a.votes||0));\n    return l;\n  }\n\n  toggleFacet = (k) => this.setState(s => ({ facets: s.facets.includes(k) ? s.facets.filter(f => f !== k) : [...s.facets, k] }));\n  openDetail = (id) => { const r = this.map()[id]; this.setState({ proto:'detail', current:id, voted:false, favorited: !!(r && r.favorited), votes: (r && r.votes) || 0 }); };\n  doGerar = () => { this.setState({ generating:true }); setTimeout(() => { try { this.setState({ generating:false, generated:true }); } catch (e) {} }, 750); };\n\n  shape(r) {\n    const kicker = r.prov === 'catalogo' ? 'Do catálogo' : r.prov === 'minha' ? 'Sua receita' : (r.auto ? 'Da comunidade · tradução automática' : 'Da comunidade');\n    const kickerColor = r.prov === 'catalogo' ? 'color:var(--color-accent-strong)' : r.prov === 'minha' ? 'color:var(--color-brand-ink)' : 'color:var(--color-muted)';\n    const meta = r.prov === 'catalogo' ? r.cozinha + ' · ' + r.categoria.toLowerCase() : (r.author ? 'por ' + r.author.name + (r.votes ? ' · ' + r.votes + ' votos' : '') : r.cozinha);\n    return { id:r.id, prov:r.prov, title:r.title, kicker, kickerColor, meta, aiPhoto:r.aiPhoto, onClick: () => this.openDetail(r.id) };\n  }\n  buildSections() {\n    const list = this.filtered().map(r => this.shape(r));\n    const secs = [];\n    const minhas = list.filter(r => r.prov === 'minha');\n    if (this.state.loggedIn && minhas.length) secs.push({ id:'minhas', label:'Minhas', sub:'suas criações', items:minhas });\n    const cat = list.filter(r => r.prov === 'catalogo');\n    if (cat.length) secs.push({ id:'cat', label:'Do catálogo', sub:'curadas', items:cat });\n    const com = list.filter(r => r.prov === 'comunidade');\n    if (com.length) secs.push({ id:'com', label:'Da comunidade', sub:'publicadas por pessoas', items:com });\n    return secs;\n  }\n\n  renderVals() {\n    const dark = this.state.dark;\n    const cur = this.cur();\n    const proto = this.state.proto;\n    const pill = (active) => active\n      ? 'border:0;cursor:pointer;font:inherit;font-size:0.78rem;font-weight:600;padding:5px 14px;border-radius:9999px;background:oklch(0.515 0.155 38);color:#fff'\n      : 'border:0;cursor:pointer;font:inherit;font-size:0.78rem;font-weight:500;padding:5px 14px;border-radius:9999px;background:transparent;color:oklch(0.42 0.02 55)';\n    const gen = this.map().frittata;\n\n    const model = {\n      desktopUrl: proto === 'detail' ? 'refogando.app/r/' + cur.id\n        : proto === 'create' ? 'refogando.app/create'\n        : proto === 'profile' ? 'refogando.app/u/marina'\n        : proto === 'mine' ? 'refogando.app/me/recipes' : 'refogando.app',\n      proto,\n      protoHome: proto === 'home', protoDetail: proto === 'detail', protoCreate: proto === 'create',\n      protoProfile: proto === 'profile', protoMine: proto === 'mine',\n      goHome: () => this.setState({ proto:'home' }),\n      goCreate: () => this.setState({ proto:'create', generated:false, generating:false }),\n      goMine: () => this.setState({ proto:'mine' }),\n      goToProfile: () => this.setState({ proto:'profile' }),\n      navColorHome: proto === 'home' ? 'var(--color-fg)' : 'var(--color-muted)',\n      navColorMine: proto === 'mine' ? 'var(--color-fg)' : 'var(--color-muted)',\n      protoTabs: [\n        { key:'home', label:'Busca' }, { key:'detail', label:'Receita' },\n        { key:'create', label:'Criar' }, { key:'profile', label:'Perfil' },\n      ].map(t => {\n        const on = proto === t.key;\n        return { ...t, onClick: () => this.setState({ proto: t.key }),\n          color: on ? 'color:var(--color-brand-ink)' : 'color:var(--color-muted)',\n          dot: 'width:6px;height:6px;border-radius:9999px;margin-bottom:1px;background:' + (on ? 'var(--color-brand-ink)' : 'transparent') };\n      }),\n\n      query: this.state.query,\n      setQuery: (e) => this.setState({ query: e.target.value }),\n      facetChips: ['Brasileira','Sobremesa','Indiana'].map(k => {\n        const on = this.state.facets.includes(k);\n        const base = 'font-size:0.74rem;border-radius:9999px;padding:5px 12px;cursor:pointer;transition:all 150ms;';\n        return { key:k, label:k, onClick: this.toggleFacet.bind(null, k),\n          style: on ? base + 'background:var(--color-brand-strong);color:var(--color-on-brand);border:1px solid var(--color-brand-strong)'\n            : base + 'background:transparent;color:var(--color-muted);border:1px solid var(--color-border)' };\n      }),\n      sortPillRel: this.state.sort === 'relevancia' ? 'background:var(--color-brand-strong);color:var(--color-on-brand);font-weight:600' : 'color:var(--color-muted)',\n      sortPillPop: this.state.sort === 'popularidade' ? 'background:var(--color-brand-strong);color:var(--color-on-brand);font-weight:600' : 'color:var(--color-muted)',\n      setRelevancia: () => this.setState({ sort:'relevancia' }),\n      setPopularidade: () => this.setState({ sort:'popularidade' }),\n      protoSections: this.buildSections(),\n      protoHasResults: this.filtered().length > 0,\n      protoNoResults: this.filtered().length === 0,\n\n      curSeal: cur.seal,\n      curKickerColor: cur.prov === 'catalogo' ? 'color:var(--color-accent-strong)' : cur.prov === 'minha' ? 'color:var(--color-brand-ink)' : 'color:var(--color-muted)',\n      curTitle: cur.title,\n      curTrParen: cur.tr ? '(' + cur.tr + ')' : '',\n      curHasAuthor: !!(cur.author && cur.author.handle !== 'voce'),\n      curAuthorName: cur.author ? cur.author.name : '',\n      curHasAviso: !!cur.aviso,\n      curAvisoTitle: cur.aviso ? cur.aviso.title : '',\n      curAvisoBody: cur.aviso ? cur.aviso.body : '',\n      curPorcoes: cur.porcoes, curDificuldade: cur.dificuldade, curCozinha: cur.cozinha, curCategoria: cur.categoria,\n      curIngredientes: cur.ingredientes, curPassos: cur.passos,\n      curIsCommunity: cur.prov === 'comunidade' && cur.votes != null,\n      favBtnStyle: this.state.favorited ? 'color:var(--color-on-brand);background:var(--color-brand-strong);border:1px solid var(--color-brand-strong)' : 'color:var(--color-fg);background:var(--color-surface);border:1px solid var(--color-border)',\n      favBtnLabel: this.state.favorited ? 'Favoritado' : 'Favoritar',\n      voteBtnStyle: this.state.voted ? 'color:var(--color-on-brand);background:var(--color-brand-strong);border:1px solid var(--color-brand-strong)' : 'color:var(--color-fg);background:var(--color-surface);border:1px solid var(--color-border)',\n      voteBtnLabel: (this.state.voted ? 'Votado · ' : 'Votar · ') + this.state.votes,\n      toggleFavorite: () => this.setState(s => ({ favorited: !s.favorited })),\n      toggleVote: () => this.setState(s => ({ voted: !s.voted, votes: s.voted ? s.votes - 1 : s.votes + 1 })),\n\n      createMode: this.state.createMode,\n      isConversa: this.state.createMode === 'conversa',\n      isEstruturado: this.state.createMode === 'estruturado',\n      convPill: this.state.createMode === 'conversa' ? 'background:var(--color-brand-strong);color:var(--color-on-brand);font-weight:600' : 'color:var(--color-muted)',\n      structPill: this.state.createMode === 'estruturado' ? 'background:var(--color-brand-strong);color:var(--color-on-brand);font-weight:600' : 'color:var(--color-muted)',\n      setConversa: () => this.setState({ createMode:'conversa', generated:false }),\n      setEstruturado: () => this.setState({ createMode:'estruturado', generated:false }),\n      doGerar: this.doGerar,\n      destilarLabel: this.state.generating ? 'Destilando…' : 'Destilar receita',\n      gerarLabel: this.state.generating ? 'Gerando…' : 'Gerar receita',\n      showGenerated: this.state.generated,\n      showCreateForm: !this.state.generated,\n      genTitle: gen.title, genDesc: gen.desc, genIngredientes: gen.ingredientes,\n      openGenerated: () => this.openDetail('frittata'),\n      resetGen: () => this.setState({ generated:false }),\n\n      profileRecipes: [\n        { title:'Feijoada vegetariana', meta:'212 votos', aiPhoto:false, onClick: () => this.openDetail('feijoada') },\n        { title:'Bolo de fubá com goiabada', meta:'12 votos', aiPhoto:true, onClick: () => this.openDetail('fuba') },\n      ],\n      mineCards: [\n        { id:'fuba', title:'Bolo de fubá com goiabada', meta:'Mineira · sobremesa · 12 votos', badges:['Pública'], aiPhoto:false, onClick: () => this.openDetail('fuba') },\n        { id:'frittata', title:'Frittata de abobrinha', meta:'Sua versão de \"Frittata clássica\"', badges:['Privada','Derivada'], aiPhoto:true, onClick: () => this.openDetail('frittata') },\n        { id:'curry', title:'Curry de grão-de-bico', meta:'Versão atual · 2 versões salvas', badges:['Privada','Regenerada'], aiPhoto:false, onClick: () => this.openDetail('curry') },\n      ],\n\n      transcriptOpen: this.state.transcriptOpen,\n      openTranscript: () => this.setState({ transcriptOpen:true }),\n      closeTranscript: () => this.setState({ transcriptOpen:false }),\n      stop: (e) => { e.stopPropagation(); },\n      transcript: [\n        { role:'Você', text:'Quero um jantar rápido com o que tenho na geladeira: ovo, abobrinha e queijo.', me:true },\n        { role:'IA', text:'Que tal uma frittata de abobrinha? Fica dourada por fora, cremosa por dentro — pronta em 20 minutos.', me:false },\n        { role:'Você', text:'Pode ser, mas sem cebola.', me:true },\n        { role:'IA', text:'Sem cebola então; uso alho-poró pra adoçar. Faço pra 4 porções?', me:false },\n        { role:'Você', text:'Isso, pra 4.', me:true },\n        { role:'IA', text:'Fechado. Quando quiser, é só pedir pra eu destilar tudo numa receita pronta, com quantidades e passos.', me:false },\n      ].map(m => ({ ...m,\n        wrap: m.me ? 'align-self:flex-end;align-items:flex-end' : 'align-self:flex-start;align-items:flex-start',\n        bubble: m.me\n          ? 'background:color-mix(in oklch,var(--color-brand) 14%,var(--color-bg));border:1px solid color-mix(in oklch,var(--color-brand) 30%,transparent);border-radius:14px 14px 4px 14px'\n          : 'background:var(--color-surface);border:1px solid var(--color-border);border-radius:14px 14px 14px 4px',\n      })),\n    };\n\n    return {\n      isLight: !dark, isDark: dark,\n      setLight: () => this.setState({ dark:false }),\n      setDark: () => this.setState({ dark:true }),\n      lightBtnStyle: pill(!dark),\n      darkBtnStyle: pill(dark),\n      model,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
