<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex; flex-direction:column; gap:12px; padding:16px; background:oklch(0.99 0.006 85); border:1px solid oklch(0.9 0.012 85); border-radius:14px;">
  <div style="display:flex; align-items:center; gap:11px;">
    <div style="flex:none; width:42px; height:42px; border-radius:9999px; background-image:repeating-linear-gradient(135deg, oklch(0.93 0.012 85) 0 6px, oklch(0.965 0.012 85) 6px 12px); border:1px solid oklch(0.9 0.012 85);"></div>
    <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;">
      <span style="font:600 14px ui-sans-serif,system-ui,sans-serif; color:oklch(0.26 0.02 55); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ name }}</span>
      <span style="font:12px ui-sans-serif,system-ui,sans-serif; color:oklch(0.505 0.025 55); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ meta }}</span>
    </div>
    <span style="flex:none; padding:5px 13px; border-radius:9999px; border:1px solid oklch(0.62 0.17 40 / 0.5); color:oklch(0.515 0.155 38); font:600 12.5px ui-sans-serif,system-ui,sans-serif;">Seguir</span>
  </div>
  <div style="display:flex; flex-direction:column;">
    <sc-for list="{{ recipes }}" as="r" hint-placeholder-count="2">
      <div style="display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid oklch(0.93 0.012 85);">
        <div style="position:relative; flex:none; width:40px; height:40px; border-radius:7px; overflow:hidden; background-image:repeating-linear-gradient(135deg, oklch(0.93 0.012 85) 0 6px, oklch(0.965 0.012 85) 6px 12px);">
          <sc-if value="{{ r.ai }}" hint-placeholder-val="{{ false }}">
            <span style="position:absolute; bottom:2px; right:2px; width:13px; height:13px; border-radius:9999px; background:#fff; box-shadow:0 1px 2px rgb(56 40 24 / 0.2); display:flex; align-items:center; justify-content:center; font-size:8px; line-height:1; color:oklch(0.62 0.17 40);">✦</span>
          </sc-if>
        </div>
        <span style="flex:1; min-width:0; font-family:'Iowan Old Style',Palatino,Georgia,serif; font-size:14px; font-weight:600; color:oklch(0.26 0.02 55); line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">{{ r.title }}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<!-- props: creator { name: string; handle?: string; recipes: { title: string; ai?: boolean }[] } ;
     meta = (handle) + ' · ' + N + (N===1 ? ' receita' : ' receitas') -->
</body>
</html>
