<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex; align-items:center; gap:{{ gap }}; padding:{{ rowPad }}; border-bottom:1px solid oklch(0.9 0.012 85);">
  <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:5px;">
    <div style="font-weight:500; font-size:{{ metaSize }}; line-height:1.3; color:oklch(0.505 0.025 55); font-family:ui-sans-serif,system-ui,sans-serif;">{{ metaText }}</div>
    <h3 style="font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif; font-size:{{ titleSize }}; font-weight:600; line-height:1.2; color:oklch(0.26 0.02 55); margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">{{ title }}</h3>
    <sc-if value="{{ hasAuthor }}" hint-placeholder-val="{{ true }}">
      <span style="font-size:{{ bySize }}; line-height:1.3; color:oklch(0.505 0.025 55); font-family:ui-sans-serif,system-ui,sans-serif;">{{ byline }}</span>
    </sc-if>
  </div>
  <div style="position:relative; flex:none; width:{{ imgW }}; height:{{ imgH }}; border-radius:10px; overflow:hidden; background-image:repeating-linear-gradient(135deg, oklch(0.93 0.012 85) 0 8px, oklch(0.965 0.012 85) 8px 16px); display:flex; align-items:center; justify-content:center;">
    <span style="font:400 9px/1 ui-monospace,Menlo,monospace; color:oklch(0.505 0.025 55); letter-spacing:0.02em; opacity:0.7;">{{ imgLabel }}</span>
    <sc-if value="{{ showAi }}" hint-placeholder-val="{{ false }}">
      <span style="position:absolute; top:8px; left:8px; display:inline-flex; align-items:center; gap:5px; background:#fff; border-radius:9999px; padding:3px 9px; box-shadow:0 1px 2px rgb(56 40 24 / 0.18); font-weight:500; font-size:{{ pillSize }}; color:oklch(0.26 0.02 55); font-family:ui-sans-serif,system-ui,sans-serif;"><span style="color:oklch(0.62 0.17 40); font-size:0.95em;">✦</span> gerada por IA</span>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:620,&quot;height&quot;:150},&quot;recipe&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ title: string; author?: string; provenance: 'catalogo'|'comunidade'|'minha'; ai?: boolean; translated?: boolean; img?: string }&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const r = this.props.recipe || {};
    const compact = !!this.props.compact;
    const provLabel = r.provenance === 'catalogo' ? 'Do catálogo' : r.provenance === 'minha' ? 'Sua receita' : 'Da comunidade';
    const meta = provLabel + (r.translated ? ' · tradução automática' : '');
    const sz = compact
      ? { imgW: '96px', imgH: '72px', titleSize: '17px', metaSize: '12px', bySize: '12.5px', rowPad: '16px 2px', gap: '14px', pillSize: '9.5px' }
      : { imgW: '152px', imgH: '104px', titleSize: '23px', metaSize: '13px', bySize: '14px', rowPad: '22px 4px', gap: '28px', pillSize: '11px' };
    return {
      title: r.title || '',
      metaText: meta,
      byline: r.author ? 'por ' + r.author : '',
      hasAuthor: !!r.author,
      showAi: !!r.ai,
      imgLabel: r.img || 'foto do prato',
      ...sz,
    };
  }
}
</script>
</body>
</html>
