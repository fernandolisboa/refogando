<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex; gap:12px; align-items:stretch; padding:14px; background:oklch(0.965 0.012 85); border:1px solid oklch(0.9 0.012 85); border-radius:12px; box-shadow:0 1px 2px rgb(56 40 24 / 0.08), 0 1px 1px rgb(56 40 24 / 0.05); box-sizing:border-box;">
  <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:6px;">
    <sc-if value="{{ isCat }}" hint-placeholder-val="{{ false }}">
      <span style="align-self:flex-start; font:500 11px/1.4 ui-sans-serif,system-ui,sans-serif; padding:2px 8px; border-radius:6px; background:oklch(0.95 0.04 150); color:oklch(0.5 0.11 152);">Do catálogo</span>
    </sc-if>
    <sc-if value="{{ isCom }}" hint-placeholder-val="{{ true }}">
      <span style="align-self:flex-start; font:500 11px/1.4 ui-sans-serif,system-ui,sans-serif; padding:2px 8px; border-radius:6px; background:oklch(0.965 0.012 85); color:oklch(0.505 0.025 55); border:1px solid oklch(0.9 0.012 85);">Da comunidade</span>
    </sc-if>
    <sc-if value="{{ isMinha }}" hint-placeholder-val="{{ false }}">
      <span style="align-self:flex-start; font:500 11px/1.4 ui-sans-serif,system-ui,sans-serif; padding:2px 8px; border-radius:6px; background:oklch(0.965 0.012 85); color:oklch(0.515 0.155 38); border:1px solid oklch(0.62 0.17 40);">Sua receita</span>
    </sc-if>
    <h3 style="font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif; font-size:17px; font-weight:600; line-height:1.2; color:oklch(0.26 0.02 55); margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">{{ title }}</h3>
    <sc-if value="{{ showTrans }}" hint-placeholder-val="{{ false }}">
      <span style="font:400 11px/1.3 ui-sans-serif,system-ui,sans-serif; color:oklch(0.505 0.025 55);">tradução automática</span>
    </sc-if>
    <div style="flex:1;"></div>
    <sc-if value="{{ hasAuthor }}" hint-placeholder-val="{{ true }}">
      <span style="font:400 12px/1.3 ui-sans-serif,system-ui,sans-serif; color:oklch(0.505 0.025 55);">{{ byline }}</span>
    </sc-if>
  </div>
  <div style="position:relative; flex:none; width:84px; height:84px; align-self:center; border-radius:8px; overflow:hidden; background-image:repeating-linear-gradient(135deg, oklch(0.93 0.012 85) 0 7px, oklch(0.965 0.012 85) 7px 14px); display:flex; align-items:center; justify-content:center;">
    <span style="font:400 8.5px/1 ui-monospace,Menlo,monospace; color:oklch(0.505 0.025 55); letter-spacing:0.02em; opacity:0.75;">{{ imgLabel }}</span>
    <sc-if value="{{ showAi }}" hint-placeholder-val="{{ false }}">
      <span style="position:absolute; bottom:5px; left:5px; font:500 9px/1 ui-sans-serif,system-ui,sans-serif; padding:2px 5px; border-radius:4px; background:oklch(0.515 0.155 38); color:#fff;">gerada por IA</span>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:112},&quot;recipe&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ title: string; author?: string; provenance: 'catalogo'|'comunidade'|'minha'; ai?: boolean; translated?: boolean; img?: string }&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const r = this.props.recipe || {};
    return {
      title: r.title || '',
      byline: r.author ? 'por ' + r.author : '',
      hasAuthor: !!r.author,
      isCat: r.provenance === 'catalogo',
      isCom: r.provenance === 'comunidade',
      isMinha: r.provenance === 'minha',
      showAi: !!r.ai,
      showTrans: !!r.translated,
      imgLabel: r.img || 'foto do prato',
    };
  }
}
</script>
</body>
</html>
