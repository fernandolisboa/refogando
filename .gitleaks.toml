# Config do gitleaks (job `sast` de .github/workflows/security.yml). Regras padrão + exceções POR CAMINHO, não
# por fingerprint: o fingerprint leva o SHA do commit, e o squash-merge do repo gera SHAs novos em main, então
# um `.gitleaksignore` reprovaria o PR seguinte por um achado que ele não trouxe (auditoria 2026-11-01).
#
# Exceções triadas, arquivo por arquivo: fixtures dos testes (senhas e chaves falsas, JWT do teste de redação) e o
# secret descartável do harness E2E (só loopback). Nenhuma é credencial real. Teste novo com segredo falso: entra
# aqui com o caminho exato, depois de conferir que é falso. Mantenha a lista curta.
title = "refogando"

[extend]
useDefault = true

[allowlist]
description = "Fixtures de teste e o secret descartável do harness E2E"
paths = [
  '''^test/ui/error-report\.test\.ts$''',
  '''^test/integration/pending-signup-purge\.test\.ts$''',
  '''^test/integration/password-reset\.test\.ts$''',
  '''^e2e/harness/constants\.ts$''',
]
