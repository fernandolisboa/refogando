# Varredura de segurança contínua (proposta da auditoria 2026-11-01, `.security-audit/REPORT.md`).
#
#  - `sast` (todo PR pra main + semanal): semgrep, gitleaks (histórico inteiro) e osv-scanner. Os binários
#    são baixados das releases com o SHA-256 conferido contra o arquivo de checksums da própria release;
#    semgrep e gitleaks reprovam o job com achado novo (os falsos positivos triados ficam excluídos pela
#    regra / pelo `.gitleaksignore`); o osv-scanner por enquanto só reporta. Nada aqui recebe secret: o job roda igual em PR de fork.
#  - `zap-baseline` (quando a Vercel publica um deploy de Preview): varredura PASSIVA do ZAP contra a URL
#    do Preview. Passiva de propósito. A varredura ATIVA semanal contra o Preview que a skill de auditoria
#    propõe fica DE FORA enquanto o Preview apontar para uma branch do Neon criada a partir de `main`, que é
#    cópia dos dados reais (achado M-7 do relatório). Varredura ativa só contra `localhost` + branch vazia.
#    Se o Preview tiver Deployment Protection, o ZAP só enxerga a tela de login da Vercel; nesse caso use um
#    "Protection Bypass for Automation" (secret VERCEL_AUTOMATION_BYPASS_SECRET) ou desligue este job.
#
# A suíte de autorização (usuário B tentando ler/alterar recursos do A) roda no `npm test` do ci.yml: os
# testes de integração dos route handlers já cobrem dono/404. Ver o relatório para os pontos sem teste.
name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # segunda, 03:00 em São Paulo
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  sast:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # gitleaks varre o histórico inteiro

      - name: Install scanners (checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          OSV_VERSION: 2.7.0
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          gl="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "$gl/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$gl/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C bin gitleaks
          osv="https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}"
          curl -fsSLO "$osv/osv-scanner_linux_amd64"
          curl -fsSLO "$osv/osv-scanner_SHA256SUMS"
          grep " osv-scanner_linux_amd64\$" osv-scanner_SHA256SUMS | sha256sum -c -
          install -m755 osv-scanner_linux_amd64 bin/osv-scanner
          pipx install semgrep==1.183.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Semgrep
        run: >
          semgrep scan --error --metrics=off
          --config p/default --config p/owasp-top-ten --config p/secrets
          --config p/nextjs --config p/typescript --config p/react
          --exclude-rule javascript.lang.security.audit.unsafe-formatstring.unsafe-formatstring
          --exclude node_modules --exclude .next .

      - name: Gitleaks (full history)
        # Falsos positivos já triados (fixtures de teste, secret descartável do E2E) moram em `.gitleaksignore`.
        run: gitleaks detect --log-opts="--all" --redact --no-banner

      - name: osv-scanner (lockfile, report-only)
        # Só o lockfile da raiz. NÃO bloqueia ainda: sobram advisories de ferramentas de dev (vite, esbuild,
        # undici 7 do jsdom…) e os da better-auth 1.6 que dependem de plugins que o app não usa (relatório
        # L-1/L-14). Quando a lista zerar (ou ganhar um osv-scanner.toml com cada exceção justificada),
        # tirar o `continue-on-error` e passar a reprovar.
        continue-on-error: true
        run: osv-scanner scan source --lockfile package-lock.json

  zap-baseline:
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: ZAP baseline (passive) against the Preview
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          allow_issue_writing: false
          fail_action: false
