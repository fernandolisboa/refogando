# Deleta a Neon preview branch que a integração Vercel-Managed cria por PR
# (naming `preview/<git-branch>`) assim que o PR fecha/merge. Evita o acúmulo de
# preview branches que estoura o limite do plano Neon (~10) e faz o deploy da
# Vercel falhar rápido (o `drizzle-kit migrate` do build não conecta).
#
# Requer no repo (Settings → Secrets and variables → Actions):
#   - secret   NEON_API_KEY      (a chave de API do Neon)
#   - variable NEON_PROJECT_ID   (o Project ID do Neon — não é secreto)
#
# Roda com o arquivo já presente na branch default (main), então só pega os
# PRs que fecharem DEPOIS deste merge. As preview branches já acumuladas no
# Neon antes deste merge precisam de uma limpeza manual única (painel do Neon).
#
# Reversível: Vercel + Neon são a stack escolhida (ver ADR-0010), mas com baixo
# lock-in. Se um dia trocar de provider, apague este workflow e remova a
# integração Vercel/Neon — nada do código de produto depende dele.
name: Cleanup Neon preview branch

on:
  pull_request:
    types: [closed]

# Chamada direta à API do Neon, como o db-backup.yml (auditoria 2026-11-01, L-4). A
# `neondatabase/delete-branch-action` saiu: mesmo fixada por SHA, ela instala `neonctl@v2` (faixa
# flutuante) com o NEON_API_KEY no ambiente e interpola o nome da branch direto no bash (injeção via
# nome de branch). Aqui o nome entra por variável de ambiente, precisa começar com `preview/` e o job só
# roda para PR do próprio repo (PR de fork nem recebe o secret). O GITHUB_TOKEN não precisa de escopo.
permissions: {}

jobs:
  delete-preview-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      NEON_API: https://console.neon.tech/api/v2
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      BRANCH: preview/${{ github.head_ref }}
    steps:
      - name: Delete the Neon preview branch
        run: |
          set -euo pipefail
          [[ "$BRANCH" == preview/* && "$BRANCH" != preview/ ]] || { echo "nome inesperado: $BRANCH"; exit 1; }
          auth=(-H "Authorization: Bearer $NEON_API_KEY")
          id=$(curl -fsS "${auth[@]}" "$NEON_API/projects/$PROJECT_ID/branches" \
            | jq -r --arg name "$BRANCH" '.branches[] | select(.name == $name and .default != true) | .id')
          if [ -z "$id" ]; then
            echo "branch $BRANCH não existe no Neon (nada a apagar)"
            exit 0
          fi
          echo "apagando $BRANCH ($id)"
          curl -fsS -X DELETE "${auth[@]}" "$NEON_API/projects/$PROJECT_ID/branches/$id" >/dev/null
