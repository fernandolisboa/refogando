# Roda typecheck + lint + build + test em todo PR pra main e em todo push na main.
# O step `Build` (next build) roda com um BETTER_AUTH_SECRET DUMMY (não-secreto) só pra
# pegar falhas que só aparecem no build — throws em import-time (ex.: a invariante de
# src/lib/auth.ts) e erros só-de-build — ANTES do deploy na Vercel, em vez de o CI ficar
# verde e a Vercel falhar. O build NÃO precisa de DATABASE_URL (getDb é lazy). Ver #68.
# (NÃO pega erro de config da Vercel tipo Framework Preset — esse é coletado no deploy.)
#
# Diferença vs. outros repos: aqui o `test` SOBE um Postgres real. O harness de
# integração (test/global-setup.ts) é provider-neutro e auto-detect:
#   - SEM TEST_DATABASE_URL  → sobe um container pgvector/pgvector:pg17 via
#     Testcontainers (precisa de Docker — já presente no runner ubuntu-latest).
#     É o caminho zero-config que usamos aqui: nenhum secret necessário.
#   - COM TEST_DATABASE_URL   → usa esse Postgres (cria um banco descartável,
#     migra, roda, dropa). Útil se um dia quisermos um service container.
# Vitest seta NODE_ENV=test, e src/lib/auth.ts só exige BETTER_AUTH_SECRET fora
# de teste — por isso o test passa sem nenhuma variável de ambiente.
#
# Job `e2e` (#589), PARALELO ao `checks`: E2E de fumaça com Playwright (Chromium, perfis desktop e
# celular) contra um `next build` + `next start` de verdade, no MODO FAKE (provedores externos trocados
# por dublês — src/server/e2e/mode.ts). O harness (e2e/harness/server.ts) sobe o próprio Postgres via
# Testcontainers, migra, semeia, builda COM o banco (como a Vercel) e serve em localhost:3100. Nenhum
# secret: o harness gera os seus e zera as chaves de provedor. Em falha, sobe o relatório + traces.
# Detalhes e como rodar local: docs/e2e.md.
name: CI

# `paths-ignore`: mudança SÓ de documentação (docs/** ou qualquer .md) NÃO roda a CI —
# um handoff/ADR/README não afeta typecheck/lint/build/test. `main` não tem branch
# protection (sem required check), então pular a CI num PR de doc NÃO trava o merge
# (o merge é manual via `gh pr merge`). Qualquer arquivo de código/config fora desses
# paths dispara a CI normalmente. O deploy da Vercel é pulado à parte (scripts/vercel-ignore.sh).
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'

# Token do GITHUB_TOKEN só de leitura: nenhum step escreve no repo (checkout, cache e upload de
# artefato não precisam de mais que isso).
permissions:
  contents: read

# Cancela runs antigos do mesmo PR/branch quando chega um push novo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build (smoke-check)
        # Secret DUMMY não-secreto: src/lib/auth.ts exige a var presente fora de teste;
        # sem ela o `next build` lança em "Collecting page data". DATABASE_URL não é
        # necessária no build (getDb é lazy). Roda antes do Test (lento) pra falhar rápido.
        env:
          BETTER_AUTH_SECRET: dummy_ci_build_secret_0123456789_abcdef
        run: npm run build

      - name: Test
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    # Build de produção + 2 perfis; folga para o runner frio (sem cache do browser).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # O browser vive fora do node_modules (~/.cache/ms-playwright): cache pela versão EXATA do
      # @playwright/test (cada versão pede a sua revisão do Chromium).
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-shell

      # Só o headless shell (o E2E roda headless): download menor que o Chromium completo.
      - name: Install Chromium (headless shell) + OS deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      # Cache do browser restaurado: as libs do SO não vêm no cache, só elas.
      - name: Install OS deps (browser from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E (smoke)
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
