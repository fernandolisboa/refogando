# Roda typecheck + lint + build + test em todo PR pra main e em todo push na main.
# O step `Build` (next build) roda com um BETTER_AUTH_SECRET DUMMY (não-secreto) só pra
# pegar falhas que só aparecem no build — throws em import-time (ex.: a invariante de
# src/lib/auth.ts) e erros só-de-build — ANTES do deploy na Vercel, em vez de o CI ficar
# verde e a Vercel falhar. O build NÃO precisa de DATABASE_URL (getDb é lazy). Ver #68.
# (NÃO pega erro de config da Vercel tipo Framework Preset — esse é coletado no deploy.)
#
# Diferença vs. outros repos: aqui o `test` SOBE um Postgres real. O harness de
# integração (test/global-setup.ts) é provider-neutro e auto-detect:
#   - SEM TEST_DATABASE_URL  → sobe um container pgvector/pgvector:pg17 via
#     Testcontainers (precisa de Docker — já presente no runner ubuntu-latest).
#     É o caminho zero-config que usamos aqui: nenhum secret necessário.
#   - COM TEST_DATABASE_URL   → usa esse Postgres (cria um banco descartável,
#     migra, roda, dropa). Útil se um dia quisermos um service container.
# Vitest seta NODE_ENV=test, e src/lib/auth.ts só exige BETTER_AUTH_SECRET fora
# de teste — por isso o test passa sem nenhuma variável de ambiente.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancela runs antigos do mesmo PR/branch quando chega um push novo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build (smoke-check)
        # Secret DUMMY não-secreto: src/lib/auth.ts exige a var presente fora de teste;
        # sem ela o `next build` lança em "Collecting page data". DATABASE_URL não é
        # necessária no build (getDb é lazy). Roda antes do Test (lento) pra falhar rápido.
        env:
          BETTER_AUTH_SECRET: dummy_ci_build_secret_0123456789_abcdef
        run: npm run build

      - name: Test
        run: npm test
